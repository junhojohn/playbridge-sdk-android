pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // PlayBridge SDK
        maven {
            url = uri("https://junhojohn.github.io/playbridge-sdk-android-maven/maven-repo")
        }
    }
}

rootProject.name = "playbridge-sdk-android"
include ':app'
include ':CommonSDK'
include ':PlayBridgeSDK'
